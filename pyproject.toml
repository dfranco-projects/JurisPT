[project]
name = "jurispt"
version = "0.1.0"
description = "rag-powered chatbot for portuguese law"
authors = [
    {name = "Daniel Franco",email = "daniel.franco.inbox@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright (==1.44.0)",
    "lxml (==5.2.1)",
    "sentence-transformers (==2.7.0)",
    "tqdm (==4.66.2)",
    "python-dotenv (==1.0.1)",
    "pytest (==8.2.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
